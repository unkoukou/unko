<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加藤純一（うんこちゃん） Portal Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
            background-color: #0f0f12;
            color: #f0f0f0;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #9146FF, #FF0000, #1DA1F2);
            padding: 2.5rem 1rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }
        .card {
            background-color: #1a1a24;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #2d2d3a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #333;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .twitch-color { color: #9146FF; border-color: #9146FF !important; }
        .youtube-color { color: #FF0000; border-color: #FF0000 !important; }
        .x-color { color: #1DA1F2; border-color: #1DA1F2 !important; }
        .btn {
            display: block;
            width: 100%;
            padding: 0.8rem;
            margin-top: 1rem;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            color: #fff;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-twitch { background-color: #9146FF; }
        .btn-youtube { background-color: #FF0000; }
        .btn-x { background-color: #000; border: 1px solid #333; }
        .embed-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            border-radius: 8px;
            background: #000;
        }
        .embed-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #777;
            font-size: 0.85rem;
            border-top: 1px solid #222;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>加藤純一（うんこちゃん） Portal</h1>
        <p>Twitch / YouTube / X（旧Twitter）情報まとめ</p>
    </header>

    <div class="container">
        
        <!-- Twitch セクション -->
        <div class="card">
            <h2 class="twitch-color">🎮 Twitch（生配信）</h2>
            <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #aaa;">メインの生配信プラットフォーム</p>
            <div class="embed-container">
                <iframe 
                    src="https://player.twitch.tv/?channel=kato_junichi0817&parent=localhost&parent=github.io" 
                    allowfullscreen>
                </iframe>
            </div>
            <a href="https://www.twitch.tv/kato_junichi0817" target="_blank" class="btn btn-twitch">Twitch チャンネルを開く</a>
        </div>

        <!-- YouTube セクション -->
        <div class="card">
            <h2 class="youtube-color">📺 YouTube</h2>
            <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #aaa;">公式チャンネル・動画アーカイブ</p>
            <div class="embed-container">
                <iframe 
                    src="https://www.youtube.com/embed?listType=playlist&list=UU02L182IipK3R_yX2Q0yA5g" 
                    allowfullscreen>
                </iframe>
            </div>
            <a href="https://www.youtube.com/@unkchan123" target="_blank" class="btn btn-youtube">YouTube チャンネルを開く</a>
        </div>

        <!-- X (Twitter) セクション -->
        <div class="card">
            <h2 class="x-color">𝕏 X（旧Twitter）</h2>
            <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #aaa;">最新のポスト・お知らせ</p>
            <div style="max-height: 400px; overflow-y: auto;">
                <a class="twitter-timeline" data-theme="dark" href="https://twitter.com/unkochan123456?ref_src=twsrc%5Etfw">Tweets by unkochan123456</a> 
                <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
            </div>
            <a href="https://x.com/unkochan123456" target="_blank" class="btn btn-x">X アカウントを開く</a>
        </div>

    </div>

    <footer>
        <p>※当サイトはファンが制作したポータルサイトです。</p>
    </footer>

</body>
</html>
